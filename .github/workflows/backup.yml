name: Nightly backup
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC nightly
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the backup
        run: |
          curl -fsS "${{ secrets.SITE_URL }}/api/backup?key=${{ secrets.BACKUP_KEY }}" -o "jcmr-$(date -u +%F).json"
          ls -l jcmr-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: jcmr-backup-${{ github.run_id }}
          path: jcmr-*.json
          retention-days: 90
